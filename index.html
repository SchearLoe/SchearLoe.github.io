<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SchearLoe 的个人主页 — 一台可以 SSH 进去的机器。输入 help 开始探索。">
<title>guest@schearloe.github.io</title>
<link rel="icon" type="image/jpeg" href="avatar.png">
<style>
  :root {
    --term-bg: #0a0e12;
    --term-panel: #0d1218;
    --fg: #b8c4a8;
    --fg-dim: #6b7a66;
    --green: #7ee787;
    --cyan: #76d7e8;
    --amber: #e3b341;
    --red: #f47067;
    --blue: #6cb6ff;
    --purple: #dcbdfb;
    --glow: rgba(126, 231, 135, .12);
  }
  [data-theme="cyan"] { --fg: #a8c8d8; --fg-dim: #5e7a86; --green: #76d7e8; --cyan: #7ee7df; --glow: rgba(118, 215, 232, .12); }
  [data-theme="amber"] { --fg: #d8c9a8; --fg-dim: #8a7c60; --green: #e3b341; --cyan: #d8a878; --glow: rgba(227, 179, 65, .12); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #05070a;
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", "PingFang SC", "Microsoft YaHei", monospace;
    color: var(--fg);
    overflow: hidden;
  }
  ::selection { background: var(--green); color: #000; }

  /* ---------- CRT 氛围 ---------- */
  .crt::before {
    content: ""; position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .14) 0 1px, transparent 1px 3px);
  }
  .crt::after {
    content: ""; position: fixed; inset: 0; z-index: 51; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .5) 100%);
  }

  /* ---------- 终端窗口 ---------- */
  .stage { height: 100%; display: flex; align-items: center; justify-content: center; padding: 0; }
  @media (min-width: 760px) { .stage { padding: 22px; } }
  .term {
    display: flex; flex-direction: column; width: 100%; height: 100%;
    background: var(--term-bg); box-shadow: 0 0 60px var(--glow), 0 0 0 1px #1c2430;
    position: relative; z-index: 10;
  }
  @media (min-width: 760px) {
    .term { max-width: 940px; height: calc(100% - 0px); border-radius: 10px; overflow: hidden; }
  }
  .titlebar {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px;
    background: var(--term-panel); border-bottom: 1px solid #1c2430; user-select: none; flex: none;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #f47067; } .dot-y { background: #e3b341; } .dot-g { background: #57ab5a; }
  .titlebar .t { flex: 1; text-align: center; color: var(--fg-dim); font-size: .8rem; }

  .screen {
    flex: 1; overflow-y: auto; padding: 16px 18px 22px; font-size: 13.5px; line-height: 1.75;
    cursor: text; scrollbar-width: thin; scrollbar-color: #2a3646 transparent;
  }
  .screen::-webkit-scrollbar { width: 8px; }
  .screen::-webkit-scrollbar-thumb { background: #2a3646; border-radius: 4px; }
  @media (max-width: 480px) { .screen { font-size: 12px; } }

  /* 输出行颜色 */
  .ok { color: var(--green); }
  .dim { color: var(--fg-dim); }
  .cyan { color: var(--cyan); }
  .amber { color: var(--amber); }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  .purple { color: var(--purple); }
  .w { color: #fff; }
  a.lnk { color: var(--cyan); text-decoration: underline; text-underline-offset: 3px; }
  a.lnk:hover { color: #fff; }
  .line { white-space: pre-wrap; word-break: break-word; min-height: 1.2em; }
  .line a { pointer-events: auto; }

  .prompt-html .u { color: var(--green); }
  .prompt-html .p { color: var(--fg-dim); }
  .prompt-html .path { color: var(--blue); }

  /* 输入行 */
  .input-row { display: flex; align-items: center; flex-wrap: wrap; }
  .input-row .mirror { white-space: pre-wrap; word-break: break-all; }
  .block-cursor {
    display: inline-block; width: .62em; height: 1.15em; background: var(--green);
    vertical-align: text-bottom; margin-left: 1px; animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #kbd {
    position: absolute; opacity: 0; width: 1px; height: 1px; border: 0; padding: 0;
    left: -9999px; top: 0;
  }

  /* neofetch */
  .neo { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin: 4px 0; }
  .neo img { width: 108px; height: 108px; border-radius: 8px; border: 1px solid #2a3646; image-rendering: auto; }
  .neo .kv { white-space: pre-wrap; }

  .banner { color: var(--green); text-shadow: 0 0 12px var(--glow); }
  .banner-sub { color: var(--fg-dim); }

  /* ---------- tmux 状态栏 ---------- */
  .tmux {
    flex: none; display: flex; align-items: center; gap: 14px; padding: 6px 14px;
    background: var(--term-panel); border-top: 1px solid #1c2430; font-size: .78rem; color: var(--fg-dim);
    user-select: none;
  }
  .tmux .seg-on { background: #1f2d3d; color: var(--green); padding: 1px 8px; border-radius: 4px; }
  .tmux .seg { background: #16202c; padding: 1px 8px; border-radius: 4px; }
  .tmux .grow { flex: 1; text-align: center; }
  @media (max-width: 640px) { .tmux .grow { display: none; } }

  noscript .fallback { padding: 40px; }
  @media (prefers-reduced-motion: reduce) {
    .block-cursor { animation: none; }
  }

  /* ---------- 底层背景：拓扑图 / 漂浮日志 / 角标 ---------- */
  #netbg { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .bg-meta {
    position: fixed; z-index: 2; pointer-events: none; user-select: none;
    font-size: 11px; color: var(--fg-dim); opacity: .6; letter-spacing: .08em; white-space: nowrap;
  }
  .bg-meta.tl { top: 14px; left: 18px; }
  .bg-meta.tr { top: 14px; right: 18px; }
  .bg-meta.bl { bottom: 14px; left: 18px; }
  .bg-meta.br { bottom: 14px; right: 18px; }
  .bg-log {
    position: fixed; z-index: 2; pointer-events: none; user-select: none;
    font-size: 11px; color: var(--fg-dim); white-space: nowrap; opacity: 0;
    transition: opacity 1.4s ease; text-shadow: 0 0 10px var(--glow);
  }
  .bg-log.show { opacity: .6; }
  @media (max-width: 1100px) { .bg-meta, .bg-log { display: none; } }
</style>
</head>
<body class="crt">
<canvas id="netbg" aria-hidden="true"></canvas>
<div class="bg-meta tl" aria-hidden="true">┌─ AS65001 · SCHLOE-NET</div>
<div class="bg-meta tr" aria-hidden="true">anycast · 185.199.108.153</div>
<div class="bg-meta bl" aria-hidden="true">uptime 99.98% · no incident</div>

  <div class="fallback">
    <h2>SchearLoe · 个人主页</h2>
    <p>这个页面是一台可交互的"终端机器"，需要启用 JavaScript 才能运行。</p>
    <p>简介：网络流量方向的全栈工程师 —— GoBGP 控制台 / NetFlow 工具 / AI Agent / iOS 健康应用 / 液态毛玻璃任务管理 slpm。</p>

<div class="stage">
  <div class="term">
    <div class="titlebar">
      <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
      <span class="t">guest@schearloe: ~ — ssh · 80×24</span>
    </div>
    <div class="screen" id="screen"></div>

      <span class="seg-on">0:main*</span>
      <span class="seg">schearloe.github.io</span>

      <span class="seg" id="tmuxTheme">green</span>
      <span class="seg" id="tmuxClock">--:--</span>
    </div>
  </div>
</div>

<input id="kbd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="终端输入">

<script>
(function () {
  "use strict";
  var screenEl = document.getElementById("screen");
  var kbd = document.getElementById("kbd");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= 主题 ================= */
  var THEMES = ["green", "cyan", "amber"];
  var theme = "green";
  try { theme = localStorage.getItem("slTheme") || "green"; } catch (e) {}
  function applyTheme() {
    document.body.removeAttribute("data-theme");
    if (theme !== "green") document.body.setAttribute("data-theme", theme);
    document.getElementById("tmuxTheme").textContent = theme;
    try { localStorage.setItem("slTheme", theme); } catch (e) {}
    if (netThemeRefresh) netThemeRefresh();
  }
  applyTheme();

  /* ================= 时钟 ================= */
  function tickClock() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    document.getElementById("tmuxClock").textContent = p(d.getHours()) + ":" + p(d.getMinutes());
  }
  tickClock();
  setInterval(tickClock, 15000);

  /* ================= 底层背景：网络拓扑 + 报文 + 漂浮日志 ================= */
  var netCanvas = document.getElementById("netbg");
  var nctx = netCanvas.getContext("2d");
  var netNodes = [], netEdges = [], netAdj = [], packets = [];
  var netThemeRefresh = null, lastT = 0;

  function cssVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }

  function netResize() {
    netCanvas.width = innerWidth * devicePixelRatio;
    netCanvas.height = innerHeight * devicePixelRatio;
    netCanvas.style.width = innerWidth + "px";
    netCanvas.style.height = innerHeight + "px";
    nctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    buildNet();
    if (reduced) drawNet(0);
  }
  function buildNet() {
    netNodes = []; netEdges = []; netAdj = []; packets = [];
    var w = innerWidth, h = innerHeight;
    var cols = Math.max(4, Math.round(w / 165));
    var rows = Math.max(3, Math.round(h / 165));
    var cw = w / cols, ch = h / rows;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        netNodes.push({
          x: c * cw + cw * (0.22 + Math.random() * 0.56),
          y: r * ch + ch * (0.22 + Math.random() * 0.56),
          hub: false, label: null
        });
      }
    }
    netNodes.forEach(function (n, i) { netAdj[i] = []; });
    netNodes.forEach(function (n, i) {
      var near = netNodes.map(function (m, j) {
        return { j: j, d: (m.x - n.x) * (m.x - n.x) + (m.y - n.y) * (m.y - n.y) };
      }).filter(function (o) { return o.j !== i; })
        .sort(function (a, b) { return a.d - b.d; })
        .slice(0, 2 + (Math.random() < 0.35 ? 1 : 0));
      near.forEach(function (o) { addEdge(i, o.j); });
    });
    /* 少量枢纽节点挂上 ASN 标注(与 bgp 彩蛋同一套编号) */
    var labels = ["AS65001", "AS4134", "AS9808", "AS65002", "IX-PUB"];
    labels.forEach(function (lab) {
      var idx = Math.floor(Math.random() * netNodes.length);
      netNodes[idx].hub = true;
      netNodes[idx].label = lab;
    });
    spawnPackets();
  }
  var edgeSeen = {};
  function addEdge(a, b) {
    var k = a < b ? a + "-" + b : b + "-" + a;
    if (a === b || edgeSeen[k]) return;
    edgeSeen[k] = 1;
    netEdges.push({ a: a, b: b });
    netAdj[a].push(b);
    netAdj[b].push(a);
  }
  function newPacket() {
    var from = Math.floor(Math.random() * netNodes.length);
    if (!netAdj[from].length) return null;
    return {
      from: from,
      to: netAdj[from][Math.floor(Math.random() * netAdj[from].length)],
      t: Math.random(),
      sp: 0.00010 + Math.random() * 0.00022,
      col: Math.random() < 0.5 ? "--green" : "--cyan"
    };
  }
  function spawnPackets() {
    packets = [];
    var target = Math.min(16, Math.round(innerWidth * innerHeight / 95000));
    for (var i = 0; i < target; i++) {
      var p = newPacket();
      if (p) packets.push(p);
    }
  }
  function drawNet(dt) {
    var green = cssVar("--green"), cyan = cssVar("--cyan"), dim = cssVar("--fg-dim");
    nctx.clearRect(0, 0, innerWidth, innerHeight);
    nctx.lineWidth = 1;
    nctx.strokeStyle = dim;
    nctx.globalAlpha = 0.13;
    netEdges.forEach(function (ed) {
      var a = netNodes[ed.a], b = netNodes[ed.b];
      nctx.beginPath(); nctx.moveTo(a.x, a.y); nctx.lineTo(b.x, b.y); nctx.stroke();
    });
    netNodes.forEach(function (n) {
      var s = n.hub ? 5 : 3;
      nctx.globalAlpha = n.hub ? 0.5 : 0.26;
      nctx.fillStyle = n.hub ? green : dim;
      nctx.fillRect(n.x - s / 2, n.y - s / 2, s, s);
      if (n.label) {
        nctx.globalAlpha = 0.42;
        nctx.fillStyle = n.hub ? green : dim;
        nctx.font = "10px ui-monospace, Consolas, 'Courier New', monospace";
        nctx.fillText(n.label, n.x + 8, n.y + 3);
      }
    });
    if (!reduced && dt > 0) {
      packets.forEach(function (p, i) {
        p.t += p.sp * dt;
        if (p.t >= 1) {
          var next = netAdj[p.to];
          if (next && next.length) {
            p.from = p.to;
            p.to = next[Math.floor(Math.random() * next.length)];
          } else {
            var np = newPacket();
            if (np) packets[i] = np;
            return;
          }
          p.t = 0;
        }
        var A = netNodes[p.from], B = netNodes[p.to];
        var x = A.x + (B.x - A.x) * p.t, y = A.y + (B.y - A.y) * p.t;
        nctx.globalAlpha = 0.75;
        nctx.fillStyle = p.col === "--green" ? green : cyan;
        nctx.beginPath();
        nctx.arc(x, y, 1.8, 0, Math.PI * 2);
        nctx.fill();
        nctx.globalAlpha = 0.18;
        nctx.beginPath();
        nctx.arc(x, y, 5, 0, Math.PI * 2);
        nctx.fill();
      });
    }
    nctx.globalAlpha = 1;
  }
  netThemeRefresh = function () { if (reduced) drawNet(0); };
  var netResizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(netResizeTimer);
    netResizeTimer = setTimeout(netResize, 180);
  });
  netResize();
  if (!reduced) {
    (function netLoop(ts) {
      var dt = Math.min(60, (ts || 0) - lastT || 16);
      lastT = ts || 0;
      drawNet(dt);
      requestAnimationFrame(netLoop);
    })();
  }

  /* 漂浮日志:只在终端窗口两侧的空地上淡入淡出 */
  var LOGS = [
    "BGP KEEPALIVE ← 185.199.108.153",
    "netflow v9 export: 2048 records",
    "[ OK ] healthcheck · 200 OK",
    "route-refresh sent → AS9808",
    "AgentScope: ReAct step 3/7 ✓",
    "SSE event stream · 42 listeners",
    "cron: weekly report generated",
    "HRV sample synced · HealthKit",
    "deploy: master → prod ✓",
    "SQLite VACUUM · 0.4s",
    "peer 65002 established · 42d",
    "cache warm · pnpm store ok"
  ];
  function spawnLogTick() {
    setTimeout(function () {
      trySpawnLog();
      spawnLogTick();
    }, 2400 + Math.random() * 3400);
  }
  function trySpawnLog() {
    if (reduced || document.hidden || innerWidth < 1100) return;
    if (document.querySelectorAll(".bg-log").length >= 3) return;
    var term = document.querySelector(".term").getBoundingClientRect();
    var pad = 34;
    var leftSpace = term.left - pad;
    var rightSpace = innerWidth - term.right - pad;
    var el = document.createElement("div");
    el.className = "bg-log";
    el.textContent = LOGS[Math.floor(Math.random() * LOGS.length)];
    el.style.top = (70 + Math.random() * (innerHeight - 190)) + "px";
    var useLeft = Math.random() < 0.5;
    if (useLeft && leftSpace > 140) {
      el.style.left = (10 + Math.random() * (leftSpace - 140)) + "px";
    } else if (rightSpace > 140) {
      el.style.left = (term.right + pad + Math.random() * (rightSpace - 140)) + "px";
    } else if (leftSpace > 140) {
      el.style.left = (10 + Math.random() * (leftSpace - 140)) + "px";
    } else {
      return;
    }
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.classList.add("show"); });
    setTimeout(function () { el.classList.remove("show"); }, 3600 + Math.random() * 1600);
    setTimeout(function () { if (el.parentNode) el.remove(); }, 5800);
  }
  if (!reduced) spawnLogTick();

  /* ================= 输出引擎 ================= */
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function lineHtml(item) {
    if (item.html !== undefined) return item.html;
    return item.text !== undefined ? escapeHtml(item.text) : "&nbsp;";
  }
  function makeLine(html, cls) {
    var div = document.createElement("div");
    div.className = "line" + (cls ? " " + cls : "");
    div.innerHTML = html || "&nbsp;";
    screenEl.appendChild(div);
    return div;
  }
  function scrollBottom() { screenEl.scrollTop = screenEl.scrollHeight; }

  /* ================= 帧驱动调度器 =================
     打字机/开机动画不走 setTimeout(后台标签会被节流到秒级),
     而是挂在 rAF 帧循环上:可见时全速,隐藏时暂停,回来继续。 */
  var schedQ = [];
  function schedule(fn, delay) {
    if (reduced) { fn(); return; }
    schedQ.push({ at: performance.now() + Math.max(0, delay || 0), fn: fn });
  }
  function runSched() {
    var now = performance.now();
    for (var i = 0; i < schedQ.length; ) {
      if (schedQ[i].at <= now) {
        var item = schedQ.splice(i, 1)[0];
        item.fn();
      } else i++;
    }
  }
  (function schedLoop() {
    runSched();
    requestAnimationFrame(schedLoop);
  })();

  /* 逐行打印（boot 用），返回 Promise */
  function typeLines(lines, lineDelay, charDelay) {
    return new Promise(function (resolve) {
      var i = 0;
      function next() {
        bootDeadline();
        if (i >= lines.length) { resolve(); return; }
        var item = lines[i++];
        if (typeof item === "string") item = { html: item };
        if (reduced || charDelay === 0 || bootSkipped) {
          makeLine(lineHtml(item), item.cls);
          scrollBottom();
          schedule(next, item.hold !== undefined ? item.hold : lineDelay);
          return;
        }
        /* 逐字 */
        var div = makeLine("", item.cls);
        var span = document.createElement("span");
        div.textContent = "";
        div.appendChild(span);
        var text = item.text !== undefined ? item.text : item.html.replace(/<[^>]+>/g, "");
        var j = 0;
        (function tickChar() {
          bootDeadline();
          if (bootSkipped) {
            div.innerHTML = lineHtml(item);
            scrollBottom();
            schedule(next, 0);
            return;
          }
          span.textContent = text.slice(0, ++j);
          scrollBottom();
          if (j < text.length) { schedule(tickChar, charDelay); }
          else { schedule(next, item.hold !== undefined ? item.hold : lineDelay); }
        })();
      }
      next();
    });
  }

  /* ================= 提示符 ================= */
  function promptHTML() {
    return '<span class="u">guest@schearloe</span><span class="p">:</span><span class="path">~</span><span class="p">$</span> ';
  }
  var inputRow = null, mirror = null, cursor = null;

  function showPrompt() {
    inputRow = document.createElement("div");
    inputRow.className = "line input-row";
    inputRow.innerHTML = promptHTML() +
      '<span class="mirror"></span><span class="block-cursor"></span>';
    mirror = inputRow.querySelector(".mirror");
    cursor = inputRow.querySelector(".block-cursor");
    screenEl.appendChild(inputRow);
    scrollBottom();
    /* 输出打印期间按下的回车:提示符就绪后自动提交 */
    if (pendingSubmit) {
      pendingSubmit = false;
      if (kbd.value) {
        var queued = kbd.value;
        kbd.value = "";
        mirror.textContent = "";
        runCommand(queued);
      }
    }
  }
  function removePrompt() {
    if (inputRow && inputRow.parentNode) inputRow.parentNode.removeChild(inputRow);
    inputRow = null;
  }

  /* ================= 命令数据 ================= */
  var ABOUT = [
    "你好,我是 <span class='w'>SchearLoe</span>。",
    "",
    "主业在<span class='cyan'>网络与流量安全</span>方向:",
    "  · GoBGP 的 Web 管理控制台(Java 17 + Spring Boot 3,gRPC 全量代理 + SSE)",
    "  · NetFlow v9 流量生成与采集测试系统(Python)",
    "  · 给异常流量分析系统造 AI 巡检助手(AgentScope + RAG)",
    "",
    "下班后接着造:液态毛玻璃任务管理 <span class='cyan'>slpm</span>(主力公开项目)、",
    "Apple Watch 压力管理 App、家庭服务器网站,以及一个文具店收银系统。",
    "",
    "小执念:<span class='amber'>东西要做完整</span> —— 部署指南、使用手册、架构文档、E2E 测试,一个都不能少。"
  ];
  var PROJECTS = {
    "slpm": {
      title: "slpm ★ 公开主力",
      desc: [
        "液态毛玻璃风格 · 智能任务与项目管理。",
        "周期性日程、动效细节、任务流转,把待办清单做成赏心悦目的工具。",
        "技术: Vue 3 / TypeScript / Playwright E2E",
        "仓库: https://github.com/SchearLoe/slpm"

  /* ================= 输出辅助 ================= */

  function cmdLs(args) {

      return printLines([
        "<span class='cyan'>projects/</span>",
        "  ★ slpm.md       <span class='dim'>液态毛玻璃 · 智能任务与项目管理(公开)</span>",

  function cmdCat(args) {

    if (f === "skills.txt") return cmdSkills();
    if (f === ".secrets") {
      return printLines([
        "<span class='amber'>📢 彩蛋被你发现了。</span>",
        "奖励你一个事实:这个页面没有用任何框架、没有构建工具,",
        "就是一个手写的 index.html —— 和我做的所有项目一样,<span class='amber'>小而完整</span>。"
      ], 25);
    }
    var m = f.match(/^projects\/(.+\.md)$/);
    if (m) {
      var key = m[1] === "pos.md" ? "pos" : m[1].replace(/\.md$/, "");
      var p = PROJECTS[key];
      if (p) {
        return printLines(["<span class='cyan'>── " + p.title + " ──</span>"].concat(
          p.desc.map(function (d) {
            return d.replace(/(https:\/\/[^\s]+)/, "<a class='lnk' href='$1' target='_blank' rel='noopener'>$1</a>");
          })
        ), 16);
      }

    return printLines(["cat: " + (f || "?") + ": 没有那个文件或目录", "<span class='dim'>试试: ls</span>"], 20);
  }

  function cmdClear() {
    screenEl.innerHTML = "";

  var COMMANDS = {
    help: cmdHelp, whoami: cmdWhoami, about: cmdAbout, skills: cmdSkills,
    now: cmdNow, contact: cmdContact, neofetch: cmdNeofetch, theme: cmdTheme,
    date: cmdDate, echo: cmdEcho, history: cmdHistory, coffee: cmdCoffee,
    sudo: cmdSudo, cowsay: cmdCowsay, exit: cmdExit, logout: cmdExit,
    clear: cmdClear, ping: cmdPing, bgp: cmdBgp, rm: cmdRm,
    ls: cmdLs, cat: cmdCat, github: cmdContact, projects: function () { return cmdLs(["projects"]); }
  };

  function runCommand(raw) {
    removePrompt();
    makeLine(promptHTML() + '<span class="w"></span>').querySelector(".w").textContent = raw;
    var input = raw.trim();
    if (!input) { showPrompt(); scrollBottom(); return; }
    history.push(input); histIdx = history.length;

    var parts = input.split(/\s+/);
    var cmd = parts[0].toLowerCase();
    var args = parts.slice(1);
    var fn = COMMANDS[cmd];
    if (fn) { fn(args).then(function () { showPrompt(); scrollBottom(); }); }
    else {
      printLines([
        "zsh: command not found: " + cmd,
        "<span class='dim'>试试 <span class='ok'>help</span> —— 或者,有些命令没写在帮助里。</span>"
      ], 20).then(function () { showPrompt(); scrollBottom(); });
    }
  }

  /* ================= 输入 ================= */
  var pendingSubmit = false;
  kbd.addEventListener("input", function () {
    if (!mirror) return;
    mirror.textContent = kbd.value;
    scrollBottom();
  });
  kbd.addEventListener("keydown", function (e) {
    if (!inputRow) {
      if (e.key === "Enter") pendingSubmit = true;
      e.preventDefault();
      return;
    }
    if (e.key === "Enter") {
      var v = kbd.value; kbd.value = ""; mirror.textContent = "";
      runCommand(v);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (histIdx > 0) { histIdx--; kbd.value = history[histIdx] || ""; mirror.textContent = kbd.value; }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (histIdx < history.length) { histIdx++; kbd.value = history[histIdx] || ""; mirror.textContent = kbd.value; }
    } else if (e.key === "Tab") {
      e.preventDefault();
      var v = kbd.value;
      var pool = v.startsWith("cat ") ? PROJECT_FILES.map(function (f) { return "cat projects/" + f; }) : Object.keys(COMMANDS);
      var hit = pool.filter(function (c) { return c.indexOf(v) === 0; });
      if (hit.length === 1) { kbd.value = hit[0] + " "; mirror.textContent = kbd.value; }
      else if (hit.length > 1) { runCommand(v + ""); kbd.value = v; }
    } else if (e.key === "l" && e.ctrlKey) {
      e.preventDefault(); cmdClear().then(showPrompt);
    }
  });
  screenEl.addEventListener("mouseup", function () { kbd.focus({ preventScroll: true }); });

  /* ================= 开机动画 ================= */
  var bootSkipped = false;
  var bootStart = performance.now();
  /* 6 秒兜底:即使被浏览器节流(如标签页被切走),开机也不会拖过 6 秒 */
  function bootDeadline() {
    if (!bootSkipped && performance.now() - bootStart > 6000) bootSkipped = true;
  }
  function skipBoot() { bootSkipped = true; }
  document.addEventListener("keydown", skipBoot, { once: true });
  screenEl.addEventListener("click", skipBoot, { once: true });

  var BOOT = [
    { text: "connecting to schearloe.github.io ...", cls: "dim", hold: 140 },
    { html: "<span class='ok'>✔ connected</span> <span class='dim'>· TLS 1.3</span>", hold: 110 },

    { html: "<span class='ok'>[ OK ]</span> easter egg daemon started", hold: 240 }
  ];

  var isCoarse = window.matchMedia("(pointer: coarse)").matches;
  typeLines(BOOT, 70, 16).then(function () {
    return printLines(bannerHTML(), 40);
  }).then(function () {
    if (!reduced) {
      return typeLines([
        { text: "这不是普通的网页 —— 是一台你可以操作的机器。", cls: "w", hold: 120 },

        { html: " ", hold: 40 }
      ], 50, 20);

    return printLines(["这不是普通的网页 —— 是一台你可以操作的机器。", "输入 help 查看命令;乱敲也可能有惊喜。", ""], 30);
  }).then(function () {
    showPrompt();
    scrollBottom();
    if (!isCoarse) kbd.focus({ preventScroll: true });
    /* 重挂跳过监听(上面 once 已消耗) */
  });
})();
